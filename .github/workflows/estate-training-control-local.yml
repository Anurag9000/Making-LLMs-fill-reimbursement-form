name: Estate local training-control certificate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Fetch exact canonical repository validator
        run: |
          python - <<'PY'
          import hashlib, urllib.request
          from pathlib import Path
          commit='1cd24a744054a480b4882eeb72308074ce5f9304'; expected='42e6fee5c30b12fb3a502d89288c1f7c71cf6533'
          url=f'https://raw.githubusercontent.com/Anurag9000/RigorousRAG/{commit}/tools/repository_local_estate_certificate.py'
          data=urllib.request.urlopen(url,timeout=60).read(); actual=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          if actual!=expected: raise SystemExit(f'canonical local validator blob mismatch: {actual} != {expected}')
          path=Path('.training_control/canonical_repository_local_estate_certificate.py'); path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(data)
          PY
      - name: Certify this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .training_control/canonical_repository_local_estate_certificate.py --repository "$GITHUB_REPOSITORY" --root . --output .training_control/local_estate_certificate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estate-local-training-control-${{ github.sha }}
          path: .training_control/local_estate_certificate.json
          if-no-files-found: warn
          retention-days: 30
