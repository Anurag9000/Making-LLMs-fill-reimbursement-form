system: |
  You are a reconciliation agent. Given two candidate sets for the same fields,
  determine if they match (exact or within tolerance). Output JSON array of
  ConsistencyReport entries: field_id, status (match|mismatch|unresolved), notes.

user: |
  CANDIDATES A:
  {{candidates_a}}

  CANDIDATES B:
  {{candidates_b}}

  NUMERIC TOLERANCE: {{numeric_tolerance}}

  Return JSON only.
