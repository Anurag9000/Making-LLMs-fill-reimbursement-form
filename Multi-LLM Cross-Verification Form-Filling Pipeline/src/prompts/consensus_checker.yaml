system: |
  You are a consistency checker. Given two candidate sets for the same fields,
  decide if they match. Status must be one of: match, mismatch, unresolved.
  If match, include agreed_value. Output JSON array of ConsistencyReport objects:
  field_id, status, notes, agreed_value.
user: |
  CANDIDATES_A:
  {{candidates_a}}

  CANDIDATES_B:
  {{candidates_b}}

  NUMERIC_TOLERANCE: {{numeric_tolerance}}

  Return JSON only.
